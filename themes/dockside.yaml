  # Optional, card-mod 4.x. Widgets: blur what lies behind them; bold titles as in the desktop's widgets;
  # section headings get a small glass capsule, so they stay readable on any part of the picture.
  card-mod-card: |
    ha-card {
      --ha-card-background: var(--dockside-glass-blurred);
      -webkit-backdrop-filter: var(--dockside-glass-filter);
      backdrop-filter: var(--dockside-glass-filter);
    }
    .card-header, .card-header .name { font-weight: 700; }
    /* the gauge draws its empty arc in the window colour; on glass it reads as a hole, so use the slider track */
    ha-gauge { --primary-background-color: var(--dockside-track); }
    :host(hui-heading-card) .container {
      width: fit-content;
      padding: 6px 14px;
      border-radius: 9999px;
      background: var(--dockside-glass-blurred);
      box-shadow: var(--dockside-rim), 0 0 0 1px var(--dockside-edge);
      -webkit-backdrop-filter: var(--dockside-glass-filter);
      backdrop-filter: var(--dockside-glass-filter);
    }
  # Optional, card-mod 4.x. Menu bar on dashboards: transparent with white text while the page is at the top. Once the
  # page scrolls (the frontend marks the header [scrolled]), widgets pass under it; the bar then darkens and blurs
  # what lies behind, so the white text keeps 4.5:1 on light glass. 13 px titles, 15 px on phones.
  card-mod-root: |
    :host { --app-header-background-color: transparent; --app-header-text-color: #ffffff; --app-header-backdrop-filter: none; }
    :host([scrolled]) { --app-header-backdrop-filter: var(--dockside-menubar-scrolled); }
    .main-title { font-size: 13px; font-weight: 700; letter-spacing: -.08px; }
    ha-tab-group { --indicator-color: transparent; --track-color: transparent; }
    ha-tab-group-tab { font-size: 13px; opacity: 1; }
    ha-tab-group-tab[active] { font-weight: 700; }
    @media (max-width: 600px) { .main-title, ha-tab-group-tab { font-size: 15px; } }
  # Optional, card-mod 4.x. Settings: the same glass with a lighter shadow, so stacked lists do not look heavy.
  card-mod-config: |
    :host { --ha-card-box-shadow: var(--dockside-rim), 0 2px 8px rgba(0,0,0,.10); }
  # Optional, card-mod 4.x. Sidebar: blurred glass to the window edge; the active page gets the dock dot.
  card-mod-sidebar: |
    :host {
      --sidebar-background-color: var(--dockside-glass-side-blurred);
      -webkit-backdrop-filter: var(--dockside-glass-filter);
      backdrop-filter: var(--dockside-glass-filter);
      font-family: var(--ha-font-family-body);
    }
    .menu { border-bottom: 0 !important; }
    ha-list-item-button { border-radius: 10px; position: relative; }
    ha-list-item-button.selected::after {
      content: "";
      position: absolute;
      left: 3px;
      top: calc(50% - 2.5px);
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--primary-text-color);
    }
