      rgb-card-background-color: "246, 246, 246"
      dockside-glass-blurred: "rgba(246,246,246,.82)"
      dockside-glass-side-blurred: "rgba(246,246,246,.78)"
      dockside-rim: "inset 0 1px 0 rgba(255,255,255,.85), inset 0 -1px 0 rgba(255,255,255,.25)"
      dockside-depth: "0 18px 42px rgba(18,12,30,.26), 0 2px 6px rgba(18,12,30,.12)"
      dockside-edge: "rgba(0,0,0,.12)"
      dockside-field: "rgba(0,0,0,.05)"
      dockside-field-hover: "rgba(0,0,0,.08)"
      dockside-switch-on: "#34c759"
      dockside-switch-on-rim: "#147530"
      dockside-switch-off: "rgba(0,0,0,.10)"
      dockside-switch-off-rim: "#6e6e73"

