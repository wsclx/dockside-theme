      dockside-fallback: "linear-gradient(180deg, #63718e 0%, #8d8299 34%, #ae938a 56%, #c19153 70%, #6b5446 84%, #2e2724 100%)"
      dockside-menubar-shade: "linear-gradient(180deg, rgba(0,0,0,.28) 0, rgba(0,0,0,0) 120px)"
      dockside-menubar: "rgba(246,246,246,.72)"
      # 84 % without blur, 82 % with blur (card-mod): secondary text keeps 4.5:1 over the darkest rocks
