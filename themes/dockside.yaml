# Dockside: a Home Assistant theme inspired by the macOS desktop. Your dashboard becomes the desktop: a photo of a
# bay as wallpaper, cards as frosted glass widgets floating above it, the header as a see-through menu bar with the
# text right on the picture. Light mode is the bay at sunset, dark mode the same bay at night.
# Community project, not affiliated with Apple or Home Assistant; see the README.
#
# The wallpaper is not part of this file (a theme can only ship one YAML file). Copy the two pictures from the
# release into /config/www/dockside/ (see the README). Without them you get a gradient in the same colours.
# Your own picture: replace the two files, or point dockside-wallpaper (per mode, below) at another file.
#
# Works without any add-on: wallpaper behind every page, glass widgets with a light rim, dark edge and deep shadow,
# the transparent menu bar, a glass sidebar, glass dialogs, green switches, blue accents, system fonts.
# With card-mod 4.x installed (optional), the card-mod-* keys add the blur behind widgets and sidebar, a 13 px menu
# bar with the current page in bold, bold widget titles, glass capsules behind section headings and a dot beside
# the active page as in a dock. Without card-mod those keys are ignored.
#
# Contrast: every text colour is measured against the darkest (light mode) or brightest (dark mode) spot of the
# supplied pictures behind the glass. Where a system colour falls short as text, a darker (or lighter) tone of the
# same hue is used. With a picture of your own, check that text on the widgets is still easy to read.
#
# Fonts: the system UI font stack only (-apple-system, system-ui). Nothing is downloaded.
Dockside:
  card-mod-theme: Dockside

  # Shared by both modes
  # The picture is the desktop: dashboards only. Settings, history, map and other pages are windows on a calm ground.
  lovelace-background: "var(--dockside-menubar-shade), var(--dockside-wallpaper) center / cover no-repeat fixed, var(--dockside-fallback)"
  ha-panel-background: "var(--primary-background-color)"
  dockside-glass-filter: "blur(30px) saturate(1.8)"
  card-background-color: "var(--dockside-glass)"
  ha-card-background: "var(--dockside-glass)"
  ha-card-border-color: "var(--dockside-edge)"
  ha-card-border-width: "1px"
  ha-card-border-radius: "20px"
  ha-card-box-shadow: "var(--dockside-rim), var(--dockside-depth)"
  ha-card-header-font-size: "17px"
  ha-badge-border-radius: "9999px"
  ha-tile-icon-border-radius: "10px"
  ha-section-grid-row-gap: "16px"
  ha-section-grid-column-gap: "16px"
  entities-card-row-gap: "10px"
  ha-dialog-border-radius: "22px"
  ha-dialog-surface-backdrop-filter: "blur(40px) saturate(1.8)"

  # Menu bar: a translucent bar like the desktop's "show menu bar background" option. With card-mod it becomes fully
  # transparent on dashboards, with white text on the shaded top edge of the picture.
  app-header-background-color: "var(--dockside-menubar)"
  app-header-text-color: "var(--primary-text-color)"
  app-header-border-bottom: "none"
  # The frontend blurs the menu bar itself through this variable (no card-mod needed)
  app-header-backdrop-filter: "blur(20px) saturate(1.6)"
  dockside-menubar-scrolled: "blur(24px) brightness(.45)"

  # Sidebar: glass to the window edge
  sidebar-background-color: "var(--dockside-glass)"
  sidebar-text-color: "var(--primary-text-color)"
  sidebar-icon-color: "var(--secondary-text-color)"
  sidebar-menu-button-text-color: "var(--primary-text-color)"

  # Switches: green track, white thumb, a rim that keeps 3:1 against the glass
  ha-switch-checked-background-color: "var(--dockside-switch-on)"
  ha-switch-checked-background-color-hover: "var(--dockside-switch-on)"
  ha-switch-checked-border-color: "var(--dockside-switch-on-rim)"
  ha-switch-checked-border-color-hover: "var(--dockside-switch-on-rim)"
  ha-switch-checked-thumb-background-color: "#ffffff"
  ha-switch-checked-thumb-background-color-hover: "#ffffff"
  ha-switch-checked-thumb-border-color: "transparent"
  ha-switch-checked-thumb-border-color-hover: "transparent"
  ha-switch-background-color: "var(--dockside-switch-off)"
  ha-switch-background-color-hover: "var(--dockside-switch-off)"
  ha-switch-border-color: "var(--dockside-switch-off-rim)"
  ha-switch-thumb-background-color: "#ffffff"
  ha-switch-thumb-background-color-hover: "#ffffff"
  ha-switch-thumb-border-color: "transparent"
  ha-switch-thumb-border-color-hover: "transparent"
  ha-switch-thumb-box-shadow: "0 1px 1px rgba(0,0,0,.16), 0 3px 8px rgba(0,0,0,.22)"
  switch-checked-button-color: "#ffffff"
  switch-checked-track-color: "var(--dockside-switch-on)"
  switch-unchecked-button-color: "#ffffff"
  switch-unchecked-track-color: "var(--dockside-switch-off)"

  # Fields inside glass widgets
  ha-color-form-background: "var(--dockside-field)"
  ha-color-form-background-hover: "var(--dockside-field-hover)"
  input-fill-color: "var(--dockside-field)"
  mdc-text-field-fill-color: "var(--dockside-field)"
  mdc-select-fill-color: "var(--dockside-field)"
  markdown-code-background-color: "var(--dockside-field)"

  # Type: the system font; desktop size steps above the 14 px body text
  ha-font-family-body: "-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  ha-font-family-heading: "-apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  ha-font-family-code: "ui-monospace, Menlo, Consolas, monospace"
  code-font-family: "ui-monospace, Menlo, Consolas, monospace"
  ha-font-size-l: "15px"
  ha-font-size-xl: "17px"
  ha-font-size-2xl: "22px"
  ha-font-size-3xl: "26px"

